services:
  bot:
    build:
      target: builder
    command: npm run dev
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./tsconfig.json:/app/tsconfig.json
    environment:
      NODE_ENV: development

  mongo:
    ports:
      - "27017:27017"

  redis:
    ports:
      - "6379:6379"
